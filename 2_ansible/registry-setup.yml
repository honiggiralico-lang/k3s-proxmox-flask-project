---
- name: Gather facts from localhost
  hosts: localhost
  connection: local
  gather_facts: yes

- name: Configure K3s to use local insecure registry
  hosts: cluster
  become: yes
  vars:
    # Legge l'IP di localhost correttamente dai fatti di localhost
    registry_ip: "{{ hostvars['localhost']['ansible_default_ipv4']['address'] }}"

  tasks:
    # Task opzionale di debug per verificare l'IP prima di scrivere
    - name: Print registry IP for verification
      debug:
        msg: "L'IP del registry utilizzato è: {{ registry_ip }}"

    - name: Ensure K3s config directory exists
      file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Create registries.yaml for K3s
      copy:
        dest: /etc/rancher/k3s/registries.yaml
        mode: '0644'
        content: |
          mirrors:
            "{{ registry_ip }}:5000":
              endpoint:
                - "http://{{ registry_ip }}:5000"

    - name: Restart K3s Master
      service:
        name: k3s
        state: restarted
      when: inventory_hostname in groups['master']

    - name: Restart K3s Agent
      service:
        name: k3s-agent
        state: restarted
      when: inventory_hostname in groups['workers']
