---
- name: Setup K3s Master Node
  hosts: master
  become: yes
  tasks:
    - name: Install K3s server (Master)
      # Usa l'ambiente di shell per eseguire lo script ufficiale
      shell: |
        curl -sfL https://get.k3s.io | sh -
      args:
        # Se k3s è già installato, non rifare il comando
        creates: /usr/local/bin/k3s

    - name: Wait for K3s API to be ready
      wait_for:
        port: 6443
        delay: 5
        timeout: 60

    - name: Get K3s node token
      command: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token

    - name: Save token to a local file on the workstation
      copy:
        content: "{{ k3s_token.stdout }}"
        dest: /tmp/k3s_token.txt
      delegate_to: localhost
      become: false

- name: Setup K3s Worker Nodes
  hosts: workers
  become: yes
  vars:
    # Prende dinamicamente l'IP del Master dall'inventory
    master_ip: "{{ groups['master'][0] }}"
  tasks:
    - name: Read token from local file
      set_fact:
        k3s_token: "{{ lookup('file', '/tmp/k3s_token.txt') }}"

    - name: Install K3s agent (Workers)
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ master_ip }}:6443 K3S_TOKEN={{ k3s_token }} sh -
      args:
        creates: /usr/local/bin/k3s
      register: k3s_agent_install
      until: k3s_agent_install.rc == 0
      retries: 3
      delay: 10
